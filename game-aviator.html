<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator (Crash) | NexusBet</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-xxxxxxxxxxxxxxxx" crossorigin="anonymous"></script>
    
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-dark: #090d16;
            --card-bg: #111827;
            --card-border: #1f2937;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
        }
        
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Inter', sans-serif; 
        }
        
        html, body { 
            width: 100%; 
            min-height: 100vh; 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
        }
        
        header { 
            background-color: rgba(17, 24, 39, 0.9); 
            backdrop-filter: blur(10px); 
            border-bottom: 1px solid var(--card-border); 
            padding: 20px 50px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            height: 80px; 
        }
        
        .logo { 
            font-size: 1.5rem; 
            font-weight: 800; 
            letter-spacing: -1px; 
        }
        
        .logo span { 
            color: var(--primary); 
        }
        
        .header-center { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }
        
        .header-center h1 { 
            font-size: 1.3rem; 
        }
        
        .header-center .game-emoji { 
            font-size: 2rem; 
        }
        
        .wallet-box { 
            display: flex; 
            align-items: center; 
            gap: 20px; 
        }
        
        .wallet-balance { 
            font-size: 1.3rem; 
            font-weight: 700; 
            color: var(--accent-green); 
        }
        
        .back-btn { 
            background: linear-gradient(135deg, var(--primary), var(--primary-hover)); 
            color: white; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 8px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.3s; 
        }
        
        .back-btn:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.3); 
        }
        
        .game-page-container { 
            padding: 40px 50px; 
            max-width: 1400px; 
            margin: 0 auto; 
        }
        
        .game-layout { 
            display: grid; 
            grid-template-columns: 1fr 350px; 
            gap: 30px; 
        }
        
        .game-main { 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
        }
        
        .game-canvas-container { 
            background: linear-gradient(135deg, #0f1419, #1a2234); 
            border: 2px solid var(--card-border); 
            border-radius: 15px; 
            padding: 20px; 
            min-height: 400px; 
            position: relative; 
            overflow: hidden; 
        }
        
        #gameCanvas { 
            width: 100%; 
            height: 400px; 
            display: block; 
            border-radius: 10px; 
        }
        
        .game-controls { 
            background: var(--card-bg); 
            border: 1px solid var(--card-border); 
            border-radius: 15px; 
            padding: 20px; 
            display: flex; 
            gap: 15px; 
            align-items: flex-end; 
        }
        
        .input-group { 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            flex: 1; 
        }
        
        .input-group label { 
            font-size: 0.85rem; 
            color: var(--text-muted); 
            text-transform: uppercase; 
            letter-spacing: 0.5px; 
        }
        
        .input-group input { 
            background: #0f1419; 
            border: 1px solid var(--card-border); 
            color: var(--text-main); 
            padding: 10px 12px; 
            border-radius: 8px; 
            font-size: 0.95rem; 
        }
        
        .input-group input:focus { 
            outline: none; 
            border-color: var(--primary); 
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.2); 
        }
        
        .play-btn { 
            background: linear-gradient(135deg, var(--accent-green), #059669); 
            color: white; 
            border: none; 
            padding: 12px 25px; 
            border-radius: 8px; 
            font-size: 1rem; 
            font-weight: 700; 
            cursor: pointer; 
            transition: all 0.3s; 
            white-space: nowrap; 
        }
        
        .play-btn:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3); 
        }
        
        .play-btn:disabled { 
            opacity: 0.5; 
            cursor: not-allowed; 
            transform: none; 
        }
        
        .cash-out-btn { 
            background: linear-gradient(135deg, #f59e0b, #d97706); 
            padding: 15px 30px; 
            font-size: 1.1rem; 
            display: none; 
            width: 100%; 
            margin-top: 10px; 
        }
        
        .cash-out-btn:hover { 
            box-shadow: 0 10px 30px rgba(245, 158, 11, 0.3); 
        }
        
        .cash-out-btn.show { 
            display: block; 
        }
        
        .sidebar { 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
        }
        
        .stats-box { 
            background: var(--card-bg); 
            border: 1px solid var(--card-border); 
            border-radius: 15px; 
            padding: 20px; 
        }
        
        .stats-box h3 { 
            font-size: 0.9rem; 
            color: var(--text-muted); 
            text-transform: uppercase; 
            margin-bottom: 15px; 
            letter-spacing: 0.5px; 
        }
        
        .stat-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 10px 0; 
            border-bottom: 1px solid var(--card-border); 
        }
        
        .stat-item:last-child { 
            border-bottom: none; 
        }
        
        .stat-label { 
            color: var(--text-muted); 
            font-size: 0.85rem; 
        }
        
        .stat-value { 
            font-weight: 700; 
            color: var(--text-main); 
        }
        
        .stat-value.win { 
            color: var(--accent-green); 
        }
        
        .stat-value.lose { 
            color: var(--accent-red); 
        }
        
        .history-box { 
            background: var(--card-bg); 
            border: 1px solid var(--card-border); 
            border-radius: 15px; 
            padding: 20px; 
            max-height: 400px; 
            overflow-y: auto; 
        }
        
        .history-box h3 { 
            font-size: 0.9rem; 
            color: var(--text-muted); 
            text-transform: uppercase; 
            margin-bottom: 15px; 
            letter-spacing: 0.5px; 
        }
        
        .history-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 8px; 
            border-radius: 5px; 
            background: #0f1419; 
            margin-bottom: 8px; 
            font-size: 0.85rem; 
        }
        
        .history-item.win { 
            border-left: 3px solid var(--accent-green); 
        }
        
        .history-item.lose { 
            border-left: 3px solid var(--accent-red); 
        }
        
        .history-multiplier { 
            font-weight: 700; 
        }
        
        .history-multiplier.win { 
            color: var(--accent-green); 
        }
        
        .history-multiplier.lose { 
            color: var(--accent-red); 
        }
        
        @media (max-width: 1024px) { 
            .game-layout { 
                grid-template-columns: 1fr; 
            } 
            .sidebar { 
                display: grid; 
                grid-template-columns: 1fr 1fr; 
                gap: 20px; 
            } 
        }
        
        @media (max-width: 768px) { 
            header { 
                padding: 15px 20px; 
            } 
            .header-center h1 { 
                font-size: 1.1rem; 
            } 
            .game-page-container { 
                padding: 20px; 
            } 
            .game-controls { 
                flex-direction: column; 
            } 
            .play-btn { 
                width: 100%; 
            } 
            .sidebar { 
                grid-template-columns: 1fr; 
            } 
        }
    </style>
</head>
<body>
    <header>
        <button class="back-btn" onclick="goBack()">← Voltar</button>
        <div class="header-center">
            <span class="game-emoji">🚀</span>
            <h1>Aviator Crash</h1>
        </div>
        <div class="wallet-box">
            <div>
                <div style="font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase;">Saldo</div>
                <div class="wallet-balance" id="balanceDisplay">R$ 1.000,00</div>
            </div>
        </div>
    </header>

    <div class="game-page-container">
        <div class="game-layout">
            <div class="game-main">
                <!-- Gráfico -->
                <div class="game-canvas-container">
                    <canvas id="gameCanvas"></canvas>
                </div>
                
                <!-- Controles -->
                <div class="game-controls">
                    <div class="input-group">
                        <label>Aposta (R$)</label>
                        <input type="number" id="betAmount" min="10" max="10000" value="100" step="10">
                    </div>
                    <button class="play-btn" id="startBtn" onclick="startGame()">COMEÇAR RODADA</button>
                </div>
                
                <!-- Botão Cash Out -->
                <button class="play-btn cash-out-btn" id="cashOutBtn" onclick="cashOut()">💰 CASH OUT</button>
            </div>
            
            <!-- Sidebar -->
            <div class="sidebar">
                <!-- Stats -->
                <div class="stats-box">
                    <h3>📊 Estatísticas</h3>
                    <div class="stat-item">
                        <span class="stat-label">Multiplicador</span>
                        <span class="stat-value" id="multiplierDisplay">-</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Ganho Potencial</span>
                        <span class="stat-value" id="potentialWin">-</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Status</span>
                        <span class="stat-value" id="statusDisplay">Pronto</span>
                    </div>
                </div>
                
                <!-- Histórico -->
                <div class="history-box">
                    <h3>📈 Histórico</h3>
                    <div id="historyContainer"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
    <script>
        let gameSimulator = null;
        let canvas = null;
        let ctx = null;
        let gameRunning = false;
        let gameCashed = false;
        let gameState = {
            multiplier: 1,
            crashPoint: null,
            startTime: null,
            history: []
        };

        window.addEventListener('DOMContentLoaded', () => {
            gameSimulator = new GameSimulator();
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            updateBalance();
            resizeCanvas();
            drawInitialState();
            loadHistory();
        });

        window.addEventListener('resize', resizeCanvas);

        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth - 40;
            canvas.height = 400;
        }

        function drawInitialState() {
            ctx.fillStyle = 'rgba(31, 41, 55, 0.5)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#9ca3af';
            ctx.font = '18px Inter';
            ctx.textAlign = 'center';
            ctx.fillText('Clique em COMEÇAR RODADA para iniciar', canvas.width / 2, canvas.height / 2);
        }

        function drawGraph() {
            // Fundo
            ctx.fillStyle = '#0f1419';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Grid
            ctx.strokeStyle = 'rgba(31, 41, 55, 0.3)';
            ctx.lineWidth = 1;
            
            // Linhas verticais
            for (let i = 0; i <= 10; i++) {
                const x = (canvas.width / 10) * i;
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            
            // Linhas horizontais
            for (let i = 0; i <= 5; i++) {
                const y = (canvas.height / 5) * i;
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
            
            // Desenhar curve
            const padding = 40;
            const graphWidth = canvas.width - padding * 2;
            const graphHeight = canvas.height - padding * 2;
            
            ctx.strokeStyle = gameRunning && !gameCashed ? '#f59e0b' : '#10b981';
            ctx.lineWidth = 3;
            ctx.beginPath();
            
            let firstPoint = true;
            
            for (let x = 0; x <= graphWidth; x += 10) {
                // Exponential curve
                const t = x / graphWidth;
                const curveMultiplier = Math.pow(gameState.multiplier, t * 5);
                const y = graphHeight - (Math.log(curveMultiplier) * graphHeight / 5);
                
                if (firstPoint) {
                    ctx.moveTo(padding + x, padding + y);
                    firstPoint = false;
                } else {
                    ctx.lineTo(padding + x, padding + y);
                }
            }
            
            ctx.stroke();
            
            // Ponto final (aviador)
            const finalT = Math.min(1, (Date.now() - gameState.startTime) / 30000);
            const finalMultiplier = Math.pow(gameState.multiplier, finalT * 5);
            const finalY = graphHeight - (Math.log(finalMultiplier) * graphHeight / 5);
            const finalX = padding + finalT * graphWidth;
            
            ctx.fillStyle = gameRunning && !gameCashed ? '#f59e0b' : '#10b981';
            ctx.beginPath();
            ctx.arc(finalX, padding + finalY, 8, 0, Math.PI * 2);
            ctx.fill();
            
            // Texto do multiplicador
            ctx.fillStyle = gameRunning && !gameCashed ? '#f59e0b' : '#10b981';
            ctx.font = 'bold 32px Inter';
            ctx.textAlign = 'center';
            ctx.fillText(gameState.multiplier.toFixed(2) + 'x', canvas.width / 2, 50);
            
            // Animação de crescimento
            if (gameRunning && !gameCashed && gameState.startTime) {
                const elapsed = (Date.now() - gameState.startTime) / 100;
                gameState.multiplier = 1 + elapsed * 0.5;
                
                // Check crash
                if (gameState.multiplier >= gameState.crashPoint) {
                    crashGame();
                }
            }
        }

        function startGame() {
            const betAmount = parseFloat(document.getElementById('betAmount').value);
            const balance = gameSimulator.getBalance();
            
            if (balance <= 0) {
                alert('Saldo insuficiente!');
                return;
            }
            
            if (betAmount <= 0 || betAmount > balance) {
                alert('Aposta inválida!');
                return;
            }
            
            gameRunning = true;
            gameCashed = false;
            gameState.multiplier = 1;
            gameState.crashPoint = 1 + (Math.random() * 5 + 0.5);
            gameState.startTime = Date.now();
            
            document.getElementById('startBtn').disabled = true;
            document.getElementById('betAmount').disabled = true;
            document.getElementById('cashOutBtn').classList.add('show');
            document.getElementById('statusDisplay').innerText = 'Em andamento...';
            
            animate();
        }

        function animate() {
            drawGraph();
            
            if (gameRunning && !gameCashed) {
                requestAnimationFrame(animate);
            }
        }

        function cashOut() {
            if (!gameRunning || gameCashed) return;
            
            gameCashed = true;
            gameRunning = false;
            
            const betAmount = parseFloat(document.getElementById('betAmount').value);
            const winAmount = betAmount * gameState.multiplier - betAmount;
            
            gameSimulator.balance += winAmount;
            gameSimulator.balance = Math.max(0, gameSimulator.balance);
            localStorage.setItem('balance', gameSimulator.balance);
            
            addToHistory(gameState.multiplier, true, betAmount, winAmount);
            updateBalance();
            
            document.getElementById('cashOutBtn').classList.remove('show');
            document.getElementById('statusDisplay').innerText = `✨ Vitória! ${gameState.multiplier.toFixed(2)}x`;
            document.getElementById('statusDisplay').style.color = '#10b981';
            document.getElementById('multiplierDisplay').innerText = gameState.multiplier.toFixed(2) + 'x';
            document.getElementById('potentialWin').innerText = `+R$ ${winAmount.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`;
            
            resetButtons();
        }

        function crashGame() {
            gameRunning = false;
            
            const betAmount = parseFloat(document.getElementById('betAmount').value);
            
            addToHistory(gameState.crashPoint, false, betAmount, -betAmount);
            
            document.getElementById('cashOutBtn').classList.remove('show');
            document.getElementById('statusDisplay').innerText = '💥 CRASH!';
            document.getElementById('statusDisplay').style.color = '#ef4444';
            document.getElementById('multiplierDisplay').innerText = gameState.crashPoint.toFixed(2) + 'x';
            document.getElementById('potentialWin').innerText = `-R$ ${betAmount.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`;
            
            // Crash animation
            ctx.fillStyle = 'rgba(239, 68, 68, 0.5)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            gameSimulator.balance -= betAmount;
            gameSimulator.balance = Math.max(0, gameSimulator.balance);
            localStorage.setItem('balance', gameSimulator.balance);
            updateBalance();
            
            resetButtons();
        }

        function addToHistory(multiplier, won, betAmount, winAmount) {
            gameState.history.unshift({
                multiplier,
                won,
                betAmount,
                winAmount,
                timestamp: new Date()
            });
            
            if (gameState.history.length > 10) {
                gameState.history.pop();
            }
            
            loadHistory();
        }

        function loadHistory() {
            const container = document.getElementById('historyContainer');
            container.innerHTML = '';
            
            if (gameState.history.length === 0) {
                container.innerHTML = '<p style="color: #9ca3af; font-size: 0.85rem;">Nenhuma rodada ainda</p>';
                return;
            }
            
            gameState.history.forEach(item => {
                const div = document.createElement('div');
                div.className = `history-item ${item.won ? 'win' : 'lose'}`;
                div.innerHTML = `
                    <span class="history-multiplier ${item.won ? 'win' : 'lose'}">${item.multiplier.toFixed(2)}x</span>
                    <span style="color: #9ca3af;">R$ ${item.betAmount.toFixed(0)}</span>
                `;
                container.appendChild(div);
            });
        }

        function resetButtons() {
            document.getElementById('startBtn').disabled = false;
            document.getElementById('betAmount').disabled = false;
        }

        function updateBalance() {
            const balance = gameSimulator.getBalance();
            document.getElementById('balanceDisplay').innerText = `R$ ${balance.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        }

        function goBack() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
