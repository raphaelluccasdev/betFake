<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack Pro | NexusBet</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-xxxxxxxxxxxxxxxx" crossorigin="anonymous"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-dark: #090d16;
            --card-bg: #111827;
            --card-border: #1f2937;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        html, body { width: 100%; min-height: 100vh; background-color: var(--bg-dark); color: var(--text-main); }
        header { background-color: rgba(17, 24, 39, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--card-border); padding: 20px 50px; display: flex; justify-content: space-between; align-items: center; height: 80px; }
        .logo { font-size: 1.5rem; font-weight: 800; letter-spacing: -1px; }
        .logo span { color: var(--primary); }
        .header-center { display: flex; align-items: center; gap: 10px; }
        .header-center h1 { font-size: 1.3rem; }
        .header-center .game-emoji { font-size: 2rem; }
        .wallet-box { display: flex; align-items: center; gap: 20px; }
        .wallet-balance { font-size: 1.3rem; font-weight: 700; color: var(--accent-green); }
        .back-btn { background: linear-gradient(135deg, var(--primary), var(--primary-hover)); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .back-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(99, 102, 241, 0.3); }
        .game-page-container { padding: 40px 50px; max-width: 1200px; margin: 0 auto; }
        .game-setup-section { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 15px; padding: 40px; margin-bottom: 40px; max-width: 600px; }
        .game-setup-section h2 { margin-bottom: 30px; font-size: 1.5rem; }
        .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
        .input-group label { font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .input-group input { background: #1a2234; border: 1px solid var(--card-border); color: var(--text-main); padding: 12px 15px; border-radius: 8px; font-size: 1rem; }
        .input-group input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 10px rgba(99, 102, 241, 0.2); }
        .play-btn { background: linear-gradient(135deg, var(--accent-green), #059669); color: white; border: none; padding: 15px 30px; border-radius: 10px; font-size: 1.1rem; font-weight: 700; cursor: pointer; width: 100%; transition: all 0.3s; margin-top: 20px; }
        .play-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3); }
        .result-container { background: var(--card-bg); border: 2px solid var(--primary); border-radius: 15px; padding: 40px; margin-top: 40px; display: none; }
        .result-container.show { display: block; }
        .result-header { text-align: center; margin-bottom: 30px; }
        .result-status { font-size: 2rem; font-weight: 800; margin-bottom: 10px; }
        .result-status.win { color: var(--accent-green); }
        .result-status.lose { color: var(--accent-red); }
        .result-details { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .result-item { background: #0f1419; padding: 20px; border-radius: 10px; text-align: center; }
        .result-item-label { color: var(--text-muted); text-transform: uppercase; font-size: 0.8rem; margin-bottom: 10px; }
        .result-item-value { color: var(--text-main); font-size: 1.5rem; font-weight: 700; }
        .result-item-value.win { color: var(--accent-green); }
        .result-item-value.lose { color: var(--accent-red); }
        .result-buttons { display: flex; gap: 15px; justify-content: center; }
        .btn-secondary { background: #1a2234; border: 1px solid var(--card-border); color: var(--text-main); padding: 12px 25px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.3s; }
        .btn-secondary:hover { background: var(--card-border); border-color: var(--primary); }
        @media (max-width: 768px) { header { padding: 15px 20px; } .header-center h1 { font-size: 1.1rem; } .game-page-container { padding: 20px; } .game-setup-section { padding: 20px; max-width: 100%; } .result-buttons { flex-direction: column; } }
    </style>
</head>
<body>
    <header>
        <button class="back-btn" onclick="goBack()">← Voltar</button>
        <div class="header-center">
            <span class="game-emoji">🃏</span>
            <h1>Blackjack Pro</h1>
        </div>
        <div class="wallet-box">
            <div>
                <div style="font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase;">Saldo</div>
                <div class="wallet-balance" id="balanceDisplay">R$ 1.000,00</div>
            </div>
        </div>
    </header>

    <div class="game-page-container">
        <div class="game-setup-section">
            <h2>Blackjack - Vence o Dealer</h2>
            <div class="input-group">
                <label>Aposta (R$)</label>
                <input type="number" id="betAmount" min="10" max="10000" value="100" step="10">
            </div>
            <button class="play-btn" onclick="playGame()">JOGAR</button>
        </div>

        <div class="result-container" id="resultContainer">
            <div class="result-header">
                <div class="result-status" id="resultStatus">VITÓRIA!</div>
            </div>
            <div class="result-details" id="resultDetails"></div>
            <div class="result-buttons">
                <button class="play-btn" onclick="resetGame()" style="background: linear-gradient(135deg, var(--primary), var(--primary-hover));">Jogar Novamente</button>
                <button class="btn-secondary" onclick="goBack()">Voltar para Seleção</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
    <script>
        let gameSimulator = null;

        window.addEventListener('DOMContentLoaded', () => {
            gameSimulator = new GameSimulator();
            updateBalance();
        });

        function updateBalance() {
            const balance = gameSimulator.getBalance();
            document.getElementById('balanceDisplay').innerText = `R$ ${balance.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        }

        function playGame() {
            const balance = gameSimulator.getBalance();
            if (balance <= 0) {
                alert('Saldo insuficiente!');
                return;
            }

            const betAmount = parseFloat(document.getElementById('betAmount').value);
            if (betAmount <= 0 || betAmount > balance) {
                alert('Aposta inválida!');
                return;
            }

            const result = gameSimulator.playBlackjack(betAmount);
            displayResult({
                betAmount: betAmount,
                details: `Sua Mão: ${result.playerTotal} | Dealer: ${result.dealerTotal}`,
                winAmount: result.winAmount,
                newBalance: gameSimulator.getBalance()
            });
        }

        function displayResult(result) {
            const container = document.getElementById('resultContainer');
            const statusDiv = document.getElementById('resultStatus');
            const detailsDiv = document.getElementById('resultDetails');

            const isWin = result.winAmount > 0;
            statusDiv.classList.remove('win', 'lose');
            statusDiv.innerText = isWin ? '✨ VITÓRIA!' : '❌ DERROTA';
            statusDiv.classList.add(isWin ? 'win' : 'lose');

            let detailsHTML = `
                <div class="result-item">
                    <div class="result-item-label">Aposta</div>
                    <div class="result-item-value">R$ ${result.betAmount.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</div>
                </div>
                <div class="result-item">
                    <div class="result-item-label">Detalhes</div>
                    <div class="result-item-value">${result.details}</div>
                </div>
                <div class="result-item">
                    <div class="result-item-label">Ganho/Perda</div>
                    <div class="result-item-value ${isWin ? 'win' : 'lose'}">
                        ${isWin ? '+' : '-'} R$ ${Math.abs(result.winAmount).toLocaleString('pt-BR', { minimumFractionDigits: 2 })}
                    </div>
                </div>
                <div class="result-item">
                    <div class="result-item-label">Novo Saldo</div>
                    <div class="result-item-value">R$ ${result.newBalance.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</div>
                </div>
            `;

            detailsDiv.innerHTML = detailsHTML;
            container.classList.add('show');
            updateBalance();
        }

        function resetGame() {
            document.getElementById('resultContainer').classList.remove('show');
            document.getElementById('betAmount').value = '100';
        }

        function goBack() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
